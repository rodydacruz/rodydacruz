name: Update profile stats

on:
  schedule:
    - cron: "0 3 * * *" # every day at 03:00 UTC
  workflow_dispatch:     # lets you run it by hand from the Actions tab
  push:
    paths:
      - .github/workflows/profile-stats.yml # run right away when these change
      - .github/scripts/stats.mjs

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build stat card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node .github/scripts/stats.mjs
      - name: Commit card if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A stats
          git diff --cached --quiet || (git commit -m "Update stat card" && git push)
